<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Inventario CPB</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
<div id="app">
  <div id="update-banner" class="update-banner hidden">
    <span>📦 Nueva base de datos disponible</span>
    <button id="btn-update-db">Actualizar</button>
  </div>
  <nav id="nav">
    <div class="navbar">
      <button class="navbar-btn" id="btn-nav-left"></button>
      <span class="navbar-title" id="nav-title">Inventario CPB</span>
      <button class="navbar-btn" id="btn-nav-right"></button>
    </div>
    <div class="filter-bar hidden" id="filter-bar"></div>
  </nav>
  <main id="main"></main>
  <nav id="tabs" class="tabbar">
    <button class="tab-item active" data-tab="lista">
      <span class="tab-icon">📋</span>
      <span class="tab-name">Lista</span>
    </button>
    <button class="tab-item" data-tab="conteos">
      <span class="tab-icon">🔢</span>
      <span class="tab-name">Conteos</span>
    </button>
    <button class="tab-item" data-tab="pedidos">
      <span class="tab-icon">🛒</span>
      <span class="tab-name">Pedidos</span>
    </button>
    <button class="tab-item" data-tab="albaranes">
      <span class="tab-icon">🚚</span>
      <span class="tab-name">Albaranes</span>
    </button>
    <button class="tab-item" data-tab="resumen">
      <span class="tab-icon">📊</span>
      <span class="tab-name">Resumen</span>
    </button>
  </nav>
</div>
<!-- Sheet overlay (compartida entre tabs) -->
<div id="sheet-overlay" class="sheet-overlay hidden">
  <div class="sheet-box" id="sheet-box">
    <div class="sheet-handle"></div>
    <div id="sheet-content"></div>
  </div>
</div>
<!-- Toast -->
<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
